; PlatformIO: mo thu muc nay trong VS Code (extension PlatformIO), chon moi truong esp32dev roi Upload + Monitor,
; hoac chay flash.bat. Arduino IDE: mo truc tiep ascon_esp32/ascon_esp32.ino (khong can tep nay).
; Dau ra Serial duoc ghi them vao platformio-device-monitor-*.log trong thu muc nay (bo loc log2file) -- gui cac tep do ve de dua vao results/07_esp32/.
[platformio]
src_dir = ascon_esp32
default_envs = esp32dev

[env]
platform = espressif32@8.0.0      ; ban da build thu tren may phat trien
framework = arduino
monitor_speed = 115200
monitor_filters = direct, log2file
build_unflags = -Os
build_flags = -O2

[env:esp32dev]           ; ESP32 thuong (Xtensa LX6, 240 MHz) -- DevKitC, WROOM-32, NodeMCU-32S ...
board = esp32dev

[env:esp32s3]            ; ESP32-S3 (Xtensa LX7)
board = esp32-s3-devkitc-1

[env:esp32c3]            ; ESP32-C3 (RISC-V RV32IMC, 160 MHz)
board = esp32-c3-devkitm-1
